app-id: com.github.andriyco13.eyespoly
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: eyespoly
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: eyespoly
    buildsystem: cmake
    config-opts:
      - "-DCMAKE_BUILD_TYPE=Release"
    sources:
      - type: dir
        path: .