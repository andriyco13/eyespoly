name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.6
      options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flatpak package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: eyespoly.flatpak
          manifest-path: com.github.andriyco13.eyespoly.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyespoly-flatpak
          path: eyespoly.flatpak

  build-rpm:
    name: Build .rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf install -y git rpm-build rpmdevtools cmake gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            qt6-qttools-devel desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      - name: Fix git ownership check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Prepare rpmbuild tree and source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rpmdev-setuptree
          mkdir -p "/tmp/eyespoly-${VERSION}"
          git archive HEAD | tar -x -C "/tmp/eyespoly-${VERSION}"
          tar -czf "$HOME/rpmbuild/SOURCES/eyespoly-${VERSION}.tar.gz" \
            -C /tmp "eyespoly-${VERSION}"
          cp packaging/rpm/eyespoly.spec "$HOME/rpmbuild/SPECS/"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" \
            "$HOME/rpmbuild/SPECS/eyespoly.spec"
      - name: Build RPM
        run: rpmbuild -ba "$HOME/rpmbuild/SPECS/eyespoly.spec"
      - name: Collect artifact
        run: |
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} dist/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: eyespoly-rpm
          path: dist/*.rpm

  build-arch:
    name: Build package (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel cmake ninja \
            qt6-base qt6-declarative qt6-multimedia qt6-tools sudo
      - uses: actions/checkout@v4
      - name: Fix git ownership check
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build with makepkg (as non-root user)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          useradd -m builder
          mkdir -p /tmp/build
          git archive HEAD | tar -x -C /tmp/build
          cp packaging/arch/PKGBUILD /tmp/build/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" /tmp/build/PKGBUILD
          chown -R builder /tmp/build
          cd /tmp/build
          sudo -u builder makepkg --nodeps -f
          mkdir -p /home/runner/work/dist
          cp *.pkg.tar.zst /home/runner/work/dist/ || cp *.pkg.tar.xz /home/runner/work/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: eyespoly-arch
          path: /home/runner/work/dist/*
  build-windows:
    name: Build package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'

      - name: Build, Deploy and Zip
        shell: pwsh
        run: |
          # 1. Збираємо проєкт (без чистки PATH, хай CMake знайде свій компілятор)
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          
          # 2. Створюємо папку для релізу і копіюємо exe
          New-Item -ItemType Directory -Force -Path dist_win
          Copy-Item build\eyespoly.exe -Destination dist_win\
          
          # 3. Підтягуємо бібліотеки Qt
          windeployqt --qmldir . dist_win\eyespoly.exe
          
          # 4. ЖОРСТКИЙ ФІКС nanosleep64: примусово копіюємо правильні DLL від Qt
          $QtBinPath = (Get-Command windeployqt).Source | Split-Path
          Copy-Item "$QtBinPath\libgcc_s_seh-1.dll" -Destination dist_win\ -Force
          Copy-Item "$QtBinPath\libstdc++-6.dll" -Destination dist_win\ -Force
          Copy-Item "$QtBinPath\libwinpthread-1.dll" -Destination dist_win\ -Force
          
          # 5. Пакуємо все у ZIP
          Compress-Archive -Path dist_win\* -DestinationPath eyespoly-windows.zip

      - name: Collect artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyespoly-windows
          path: eyespoly-windows.zip

      - name: Collect artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyespoly-windows
          path: eyespoly-windows.zip
  release:
    name: Publish GitHub Release
    needs: [build-flatpak, build-rpm, build-arch, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release with all packages
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true